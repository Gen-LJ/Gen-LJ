# Redraws the contribution-grid dragon shown in README.md.
# It runs every day, on each push to main, and on demand from the Actions tab.
name: Summon the dragon

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dragon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Breathe fire on the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # first dot colour = no contributions, then light to heavy days
          outputs: |
            dist/dragon-light.svg?color_snake=#9b1c1c&color_dots=#efe7d4,#e3cc8f,#cfa84e,#a67c2e,#6e4f1c
            dist/dragon-dark.svg?color_snake=#e0533d&color_dots=#1f1a14,#4a3a22,#7a5c2c,#b0852f,#e8c35a

      - name: Carry the scroll to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
